buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            jvmArg '-Dfile.encoding=UTF-8'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory project.file('run/client')
            if (project.hasProperty('quickplay')) args '--quickPlayMultiplayer', project.property('quickplay')
            if (project.hasProperty('username')) args '--username', project.property('username')
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // Проверка загрузки: ./gradlew runGameTestServer — сервер стартует и выходит.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}


// Вставки в чужие моды (только remap=false, цели — классы модов): WorldEdit — ленивые состояния блоков.
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // WorldEdit 7.2.15 (jar из сборки, libs/ в .gitignore) — только для компиляции заплатки; в игре он не обязателен.
    compileOnly files('libs/worldedit-mod-7.2.15.jar')
    // player-animation-lib + bendy-lib — только для компиляции заплатки сгибов.
    compileOnly files('libs/player-animation-lib-forge-1.0.2-rc1+1.20.jar', 'libs/bendy-lib-forge-4.0.0.jar')
    compileOnly files('libs/Cuffed-1.20.1-1.3.13.jar')
    compileOnly files('libs/figura-0.1.5+1.20.1-forge-mc.jar')
    compileOnly files('libs/effortlessbuilding-1.20.1-3.11.jar')
    compileOnly files('libs/Tips-Forge-1.20.1-12.1.9.jar', 'libs/tacz_tactical_breaching-forge-1.20.1-1.0.5.jar')
    compileOnly files('libs/sa_essentials-forge-1.20.1-1.0.0-fixed.jar')
    compileOnly files('libs/glow_sticks-forge-1.20.1-7.5.1.jar')
    compileOnly files('libs/emotecraft-for-MC1.20.1-2.2.7-b.build.50-forge.jar')
    compileOnly files('libs/legendarysurvivaloverhaul-1.20.1-2.4.2.jar', 'libs/rpcore-0.8.6-1.20.1-forge.jar')
    // SCP: Overtime, CraftedCore, Walkers — заплатки трафика (26.10).
    compileOnly files('libs/scpo-2.1-forge-1.20.1.jar', 'libs/craftedcore-5.8.2.jar', 'libs/walkers-5.8.11.jar', 'libs/geckolib-forge-1.20.1-4.8.4.jar', 'libs/remorphed-4.2.jar')
    compileOnly files('libs/MekanismExplosives-1.20.1-0.3.5.jar', 'libs/csaugmentations-1.0.6.6.jar', 'libs/ZeroContact-main-build-72-36c6a8f.jar')
    // industrialhellscape — стулья (28.10).
    compileOnly files('libs/industrialhellscape-0.3.6A-1-1.20.1.jar')
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
